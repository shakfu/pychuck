[project]
name = "numchuck"
version = "0.2.1"
description = "Python bindings for ChucK audio programming language"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
keywords = ["chuck", "audio", "music", "synthesis", "live-coding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.20",
    "prompt-toolkit>=3.0.52",
    "pygments>=2.19.2",
    "watchdog>=3.0.0",
]

[dependency-groups]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]
dev = [
    "mypy>=1.14.1",
    "pytest>=8.3.5",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=7.0.0",
    "pytest-review>=0.1.1",
    "ruff>=0.14.10",
    "twine>=6.1.0",
    "types-Pygments>=2.18.0",
]

[project.urls]
Homepage = "https://github.com/shakfu/numchuck"

[project.scripts]
numchuck = "numchuck.cli.main:main"

[build-system]
requires = ["scikit-build-core >=0.10", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
# Protect the configuration against future changes in scikit-build-core
minimum-version = "build-system.requires"

# A set of patterns to exclude from the wheel.
wheel.exclude = ["*.cpp"]

# Build stable ABI wheels for CPython 3.12+
wheel.py-api = "cp312"

# Files to include in the SDist even if they are skipped by default. Supports gitignore syntax.
sdist.include = []

# Files to exclude from the SDist even if they are included by default. Supports gitignore syntax.
sdist.exclude = []

# Install chugins into the wheel
cmake.args = ["-DNUMCHUCK_INSTALL_CHUGINS=ON"]

# Setuptools-style build caching in a local directory
build-dir = "build/{wheel_tag}"

[tool.cibuildwheel]
# Necessary to see build output from the actual compilation
build-verbosity = 1

# Match requires-python (>=3.10). cp39 wheels were being built and would then
# be rejected at install time.
build = "cp310-* cp311-* cp312-* cp313-*"

# Skip 32-bit and musllinux builds
skip = "*-win32 *-manylinux_i686 *-musllinux_*"

# Run pytest to ensure that the package was correctly built
test-command = "pytest {project}/tests -v --tb=short -k 'not realtime'"
test-requires = ["pytest", "numpy"]

# Skip testing on emulated architectures (slow) and Windows (access violation in tests)
test-skip = "*-macosx_arm64 *-manylinux_aarch64 *-win_amd64"

# macOS ARM64 requires deployment target 11.0+
[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"

# Linux: Install build dependencies (manylinux uses yum/dnf)
[tool.cibuildwheel.linux]
before-build = "yum install -y alsa-lib-devel libsndfile-devel bison flex || (apt-get update && apt-get install -y libasound2-dev libsndfile1-dev bison flex)"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["thirdparty", "build", "dist", ".git", ".venv", "venv", "__pycache__"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

