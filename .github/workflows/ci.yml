name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        exclude:
          # Windows Python 3.13 might have compatibility issues
          - os: windows-latest
            python-version: '3.13'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            libsndfile1-dev \
            libjack-dev \
            bison \
            flex

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake bison flex

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: Build and install package
        run: |
          uv sync --reinstall-package numchuck

      - name: Run tests
        run: |
          # Skip: realtime (no audio device), wavfile (WvOut timing), chugin (not bundled), tui (requires console)
          uv run pytest -v --tb=short -k "not realtime and not wavfile and not chugin and not tui"

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install linting tools
        run: |
          uv pip install --system ruff

      # No --select here on purpose: the rules live in pyproject.toml so this
      # job and `make lint` check the same thing. They did not, and import
      # sorting was enforced only on the runner.
      - name: Run ruff check
        run: |
          ruff check src/

      - name: Run ruff format check
        run: |
          ruff format --check src/

  realtime:
    name: Real-time Audio Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            libsndfile1-dev \
            libasound2-plugins \
            alsa-utils \
            bison \
            flex

      # The tap seqlock is the most intricate code in the project and its only
      # regression test needs an audio device, so it otherwise runs nowhere but
      # a developer laptop. snd-dummy was the first attempt and is not an
      # option: the Azure runner images carry no ALSA kernel modules
      # ("modprobe: Module snd-dummy not found"). A PulseAudio null sink needs
      # no kernel support, so try that, and record which route worked.
      - name: Set up an audio device
        id: audio
        run: |
          if sudo modprobe snd-dummy 2>/dev/null && test -e /dev/snd/pcmC0D0p; then
            echo "method=snd-dummy" >> "$GITHUB_OUTPUT"
          elif sudo apt-get install -y pulseaudio libasound2-plugins \
               && pulseaudio --start --exit-idle-time=-1 \
               && pactl load-module module-null-sink sink_name=numchuck; then
            echo "method=pulseaudio-null-sink" >> "$GITHUB_OUTPUT"
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
          fi
          aplay -l || true
          pactl list short sinks || true

      - name: Build and install package
        run: |
          uv sync --reinstall-package numchuck

      # -rs prints the reason for every skip, so a run that tested nothing says
      # so in the log rather than passing quietly.
      - name: Run real-time tests
        if: steps.audio.outputs.method != 'none'
        run: |
          echo "audio device via ${{ steps.audio.outputs.method }}"
          uv run pytest -v --tb=short -rs -m realtime

      # A runner that cannot provide any audio device is a limitation of the
      # environment, not a defect in the code, so it warns rather than failing
      # the build -- but it must not be silent, or the workflow would look like
      # it had covered the tap tests when it had not.
      - name: Report a missing audio device
        if: steps.audio.outputs.method == 'none'
        run: |
          echo "::warning title=Real-time tests skipped::No audio device could be created on this runner; the tap regression tests did not run."

  docs:
    name: Docs Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            libsndfile1-dev \
            bison \
            flex

      # mkdocstrings introspects the compiled extension to pull its docstrings,
      # so the package has to be built before the docs can be.
      - name: Build and install package
        run: |
          uv sync --group docs --reinstall-package numchuck

      # --strict: a broken cross-reference or a page missing from the nav fails
      # the build rather than shipping a dead link.
      - name: Build documentation
        run: |
          uv run --group docs mkdocs build --strict

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            libsndfile1-dev \
            bison \
            flex

      - name: Build and install package
        run: |
          uv sync --reinstall-package numchuck

      - name: Run mypy
        run: |
          uv run mypy --strict src/

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            libsndfile1-dev \
            bison \
            flex

      - name: Install package with coverage
        run: |
          uv sync --reinstall-package numchuck
          uv pip install --system pytest-cov

      - name: Run tests with coverage
        run: |
          # Skip: realtime (no audio device), wavfile (WvOut timing), chugin (not bundled), tui (requires console)
          uv run pytest --cov=numchuck --cov-report=xml --cov-report=term -k "not realtime and not wavfile and not chugin and not tui"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
