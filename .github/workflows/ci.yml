name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        exclude:
          # Windows Python 3.13 might have compatibility issues
          - os: windows-latest
            python-version: '3.13'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install system dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            libjack-dev \
            bison \
            flex

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake bison flex

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake --installargs 'ADD_CMAKE_TO_PATH=System'

      - name: Build and install package
        run: |
          uv sync --reinstall-package numchuck

      - name: Run tests
        run: |
          # Skip: realtime (no audio device), wavfile (WvOut timing), chugin (not bundled), tui (requires console)
          uv run pytest -v --tb=short -k "not realtime and not wavfile and not chugin and not tui"

      - name: Verify clean exit
        if: runner.os != 'Windows'
        run: |
          uv run pytest -k "not realtime and not wavfile and not chugin and not tui" || exit_code=$?
          if [ "$exit_code" != "0" ]; then
            echo "Tests failed with exit code $exit_code"
            exit 1
          fi

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install linting tools
        run: |
          uv pip install --system ruff

      - name: Run ruff check
        run: |
          ruff check src/numchuck --select E,F,W,I --ignore E501

      - name: Run ruff format check
        run: |
          ruff format --check src/numchuck

  realtime:
    name: Real-time Audio Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            libasound2-plugins \
            alsa-utils \
            bison \
            flex

      # The tap seqlock is the most intricate code in the project and its only
      # regression test needs an audio device. snd-dummy provides one without
      # hardware, so the test runs here instead of only on a developer laptop.
      - name: Set up a dummy ALSA device
        run: |
          sudo modprobe snd-dummy
          # Fail loudly rather than let the tests skip themselves into a
          # green run that checked nothing.
          aplay -l
          test -e /dev/snd/pcmC0D0p

      - name: Build and install package
        run: |
          uv sync --reinstall-package numchuck

      - name: Run real-time tests
        run: |
          uv run pytest -v --tb=short -rs -m realtime

  docs:
    name: Docs Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            bison \
            flex

      # mkdocstrings introspects the compiled extension to pull its docstrings,
      # so the package has to be built before the docs can be.
      - name: Build and install package
        run: |
          uv sync --group docs --reinstall-package numchuck

      # --strict: a broken cross-reference or a page missing from the nav fails
      # the build rather than shipping a dead link.
      - name: Build documentation
        run: |
          uv run --group docs mkdocs build --strict

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            bison \
            flex

      - name: Build and install package
        run: |
          uv sync --reinstall-package numchuck

      - name: Run mypy
        run: |
          uv run mypy --strict src/

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libasound2-dev \
            bison \
            flex

      - name: Install package with coverage
        run: |
          uv sync --reinstall-package numchuck
          uv pip install --system pytest-cov

      - name: Run tests with coverage
        run: |
          # Skip: realtime (no audio device), wavfile (WvOut timing), chugin (not bundled), tui (requires console)
          uv run pytest --cov=numchuck --cov-report=xml --cov-report=term -k "not realtime and not wavfile and not chugin and not tui"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
